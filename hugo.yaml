baseURL: "https://blog.unicome.org/"
locale: zh-CN
defaultContentLanguage: zh
hasCJKLanguage: true
title: 张刚的写作
theme: PaperMod
enableRobotsTXT: true
pagination:
  pagerSize: 10
summaryLength: 120

taxonomies:
  category: categories   # 栏目
  tag: tags               # 标签
  series: series          # 作品与系列

params:
  author: 张刚
  description: 记录人如何在时间里活过，也记录世界正在怎样改变。
  mainSections: [posts]
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true      # 全文 RSS，便于导入 Substack
  math: true                   # 在文章 front matter 中 math: true 启用 KaTeX
  homeInfoParams:
    Title: 给以后翻到这里的自己
    Content: |
      年轻时很反感写日记。现在倒有些事，愿意趁还记得，写下来。尤其是那些后来想通了的事。一个人一旦想通，很容易以为自己当初也是这么想的。

      做投资就有这个毛病。一家公司，过两年再看，哪一季生意开始好转，哪一笔钱花错了，翻翻账，大致说得清楚。可把日子拨回去，那一季的报表还没出来，手边只有上一季的数字。当时有两种可能，我为什么信了其中一种？要是没记下来，等结果出来再回忆，多半会把当年的自己想得聪明一点。

      所以我愿意留着一些后来证明想错了的判断。过几年再翻，我还可以知道，在事情没有结果的时候，我从这里望过去，看得见多远。

      写历史也有一点相通。今天读到一桩几百年前的远航生意，船到了哪里，货卖了多少钱，往往在同一页上就读完了。出钱的人要在这一页的头两行里做决定，然后回家，接着过他的日子。我写《金融四百年》，常常愿意在这两行之间多待一会儿。

      小说又给了我一点别的余地。《花还在》里有一排银杏。沈落刚去归档馆上班时，有一棵比旁边的矮一截。六年过去，它已经跟别的树一样高了。头一次经过的人，看到的是一排很整齐的树。沈落也看得见从前矮下去的那一截。她在这条路上走了六年。

      这个博客里会放些金融和投资的文章，也会放小说，放一些还没想清楚、暂且只写了几行的念头。偶尔有人翻到某一篇，想起自己的事，我会很高兴。还有一个读者，是以后年纪大了的我。他大概已经改了不少主意，今天看得很重的事，到他那里，也许只肯给两行字。

      趁我还记得，先把这两行写长一点。
  footer:
    text: 原来你也来过这里
  fuseOpts:
    keys: ["title", "permalink", "summary", "content"]
