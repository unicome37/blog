baseURL: "https://blog.unicome.org/"
locale: zh-CN
defaultContentLanguage: zh
hasCJKLanguage: true
title: 张刚的写作
theme: PaperMod
enableRobotsTXT: true
pagination:
  pagerSize: 10
summaryLength: 120

taxonomies:
  category: categories   # 栏目
  tag: tags               # 标签
  series: series          # 作品与系列

params:
  author: 张刚
  description: 记录人如何在时间里活过，也记录世界正在怎样改变。
  mainSections: [posts]
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true      # 全文 RSS，便于导入 Substack
  math: true                   # 在文章 front matter 中 math: true 启用 KaTeX
  homeInfoParams:
    Title: 张刚的写作
    Content: 记录人如何在时间里活过，也记录世界正在怎样改变。
  footer:
    text: 原来你也来过这里
  fuseOpts:
    keys: ["title", "permalink", "summary", "content"]
  # --- giscus 评论（待配置） ---
  # comments: true
  # giscus:
  #   repo: "unicome/blog"
  #   repoId: ""
  #   category: "Announcements"
  #   categoryId: ""
  # --- 统计（待配置） ---
  # analytics:
  #   google:
  #     SiteVerificationTag: ""

menu:
  main:
    - {identifier: posts, name: 文章, url: /posts/, weight: 10}
    - {identifier: columns, name: 栏目, url: /categories/, weight: 20}
    - {identifier: series, name: 作品与系列, url: /series/, weight: 30}
    - {identifier: archives, name: 归档, url: /archives/, weight: 40}
    - {identifier: search, name: 搜索, url: /search/, weight: 50}
    - {identifier: about, name: 关于, url: /about/, weight: 60}

outputs:
  home: [HTML, RSS, JSON]

markup:
  goldmark:
    renderer: {unsafe: true}
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
