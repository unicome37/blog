{{- define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}
  <div class="post-description">{{ . }}</div>
  {{- end }}
</header>
{{- with .Content }}
<div class="post-content md-content">{{ . }}</div>
{{- end }}
{{- partial "columns_list.html" (dict) }}
{{- end }}
